name: Release

on:
  push:
    branches: ["chore/scaffold"]

# contents/pull-requests: changesets opens the version PR.
# id-token: npm Trusted Publishing (OIDC) — publish without a long-lived token.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1 (newer than what Node bundles).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test

      # Opens/updates a "Version Packages" PR; when that PR merges (changesets
      # consumed), runs the publish script.
      #
      # Publishing uses npm Trusted Publishing via OIDC — no NPM_TOKEN. This
      # requires a one-time setup on npmjs.com: package Settings → Publishing
      # access → add a Trusted Publisher (GitHub Actions) pointing at
      #   repo: dispbd/tailwind-classify   workflow: release.yml
      # Until that's configured, publishing will fail; either set it up first,
      # or temporarily restore `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` here.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
