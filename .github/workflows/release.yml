name: Release

on:
  push:
    branches: ["chore/scaffold"]

# Allow the changesets action to open the version PR and publish.
permissions:
  contents: write
  pull-requests: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm test

      # Opens/updates a "Version Packages" PR; when that PR merges (changesets
      # consumed), runs the publish script.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
